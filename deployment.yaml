apiVersion: apps/v1
kind: Deployment
metadata:
  name: header-validator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: header-validator
  template:
    metadata:
      labels:
        app: header-validator
    spec:
      containers:
        - name: header-validator
          image: header-validator:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: api-key